services:
  ocr-api:
    image: ${IMAGE_NAME}
    container_name: right-route-ocr-api
    ports:
      - "${PORT:-8001}:${PORT:-8001}"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8001}
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '8001') + '/', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
