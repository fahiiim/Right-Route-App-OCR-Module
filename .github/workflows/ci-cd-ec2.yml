name: CI-CD Deploy EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: right-route-ec2-deploy
  cancel-in-progress: true

jobs:
  ci:
    name: CI checks and image package
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: right-route-ocr:${{ github.sha }}
      IMAGE_TAR: right-route-ocr-${{ github.sha }}.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate syntax
        run: |
          python -m compileall -q api.py main.py

      - name: Build Docker image
        run: docker build -t "${IMAGE_TAG}" .

      - name: Export Docker image artifact
        run: docker save "${IMAGE_TAG}" | gzip > "${IMAGE_TAR}"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: right-route-ocr-image
          path: ${{ env.IMAGE_TAR }}
          retention-days: 1

  deploy:
    name: CD deploy to EC2
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: right-route-ocr:${{ github.sha }}
      IMAGE_TAR: right-route-ocr-${{ github.sha }}.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: right-route-ocr-image
          path: .

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets['EC2_HOST'] }}
          username: ${{ secrets['EC2_USER'] }}
          key: ${{ secrets['EC2_SSH_KEY'] }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -eu
            APP_DIR=/opt/right-route-ocr
            DEPLOY_USER="$(id -un)"
            sudo mkdir -p "${APP_DIR}"
            sudo chown -R "${DEPLOY_USER}:${DEPLOY_USER}" "${APP_DIR}"

      - name: Sync project files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets['EC2_HOST'] }}
          username: ${{ secrets['EC2_USER'] }}
          key: ${{ secrets['EC2_SSH_KEY'] }}
          source: "docker-compose.ec2.yml"
          target: "/opt/right-route-ocr"
          overwrite: true
          rm: false
          strip_components: 0
          tar_dereference: true

      - name: Sync Docker image artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets['EC2_HOST'] }}
          username: ${{ secrets['EC2_USER'] }}
          key: ${{ secrets['EC2_SSH_KEY'] }}
          source: ${{ env.IMAGE_TAR }}
          target: "/opt/right-route-ocr"
          overwrite: true
          rm: false
          strip_components: 0
          tar_dereference: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          IMAGE_TAR: ${{ env.IMAGE_TAR }}
          PORT: ${{ secrets['PORT'] }}
          AWS_REGION: ${{ secrets['AWS_REGION'] }}
          AWS_ACCESS_KEY: ${{ secrets['AWS_ACCESS_KEY'] }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets['AWS_SECRET_ACCESS_KEY'] }}
          AWS_S3_BUCKET: ${{ secrets['AWS_S3_BUCKET'] }}
          OPENAI_API_KEY: ${{ secrets['OPENAI_API_KEY'] }}
        with:
          host: ${{ secrets['EC2_HOST'] }}
          username: ${{ secrets['EC2_USER'] }}
          key: ${{ secrets['EC2_SSH_KEY'] }}
          command_timeout: 45m
          script_stop: true
          envs: IMAGE_TAG,IMAGE_TAR,PORT,AWS_REGION,AWS_ACCESS_KEY,AWS_SECRET_ACCESS_KEY,AWS_S3_BUCKET,OPENAI_API_KEY
          script: |
            set -eu

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found. Installing Docker engine..."
              curl -fsSL https://get.docker.com | sudo sh
            fi

            USE_SUDO_DOCKER=0
            if ! docker info >/dev/null 2>&1; then
              USE_SUDO_DOCKER=1
            fi

            docker_cmd() {
              if [ "${USE_SUDO_DOCKER}" -eq 1 ]; then
                sudo docker "$@"
              else
                docker "$@"
              fi
            }

            docker_compose() {
              if [ "${USE_SUDO_DOCKER}" -eq 1 ]; then
                sudo docker compose "$@"
              else
                docker compose "$@"
              fi
            }

            if ! docker_compose version >/dev/null 2>&1; then
              echo "Docker Compose plugin not found. Installing..."
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi

            APP_DIR=/opt/right-route-ocr
            APP_PORT="${PORT:-8001}"

            for required in AWS_REGION AWS_ACCESS_KEY AWS_SECRET_ACCESS_KEY OPENAI_API_KEY IMAGE_TAG IMAGE_TAR; do
              eval "value=\${$required:-}"
              if [ -z "${value}" ]; then
                echo "Missing required GitHub Secret: ${required}"
                exit 1
              fi
            done

            if ! echo "${AWS_REGION}" | grep -Eq '^[a-z]{2}-[a-z]+-[0-9]+$'; then
              echo "Invalid AWS_REGION secret value: ${AWS_REGION}"
              echo "Use region code format such as eu-north-1 or us-east-1."
              exit 1
            fi

            cd "${APP_DIR}"

            if [ ! -f "${IMAGE_TAR}" ]; then
              echo "Docker image artifact not found: ${IMAGE_TAR}"
              ls -la
              exit 1
            fi

            gzip -dc "${IMAGE_TAR}" | docker_cmd load
            rm -f "${IMAGE_TAR}"

            cat > .env <<EOF
            PORT=${APP_PORT}
            IMAGE_NAME=${IMAGE_TAG}
            AWS_REGION=${AWS_REGION}
            AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
            AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            AWS_S3_BUCKET=${AWS_S3_BUCKET}
            OPENAI_API_KEY=${OPENAI_API_KEY}
            EOF

            docker_compose -f docker-compose.ec2.yml down --remove-orphans || true
            docker_compose -f docker-compose.ec2.yml up -d --force-recreate

            HEALTH_URL="http://127.0.0.1:${APP_PORT}/"
            ATTEMPTS=20
            COUNT=1
            until [ "${COUNT}" -gt "${ATTEMPTS}" ]; do
              if command -v curl >/dev/null 2>&1; then
                if curl --fail --silent "${HEALTH_URL}" >/dev/null; then
                  echo "Deployment successful. Health check passed."
                  exit 0
                fi
              elif command -v wget >/dev/null 2>&1; then
                if wget -q -O /dev/null "${HEALTH_URL}"; then
                  echo "Deployment successful. Health check passed."
                  exit 0
                fi
              fi
              sleep 3
              COUNT=$((COUNT + 1))
            done

            echo "Health check failed after deployment."
            docker_compose -f docker-compose.ec2.yml ps
            docker_compose -f docker-compose.ec2.yml logs --tail=100
            exit 1
