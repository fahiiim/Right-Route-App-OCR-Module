name: CI-CD Deploy EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: right-route-ec2-deploy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: CI checks and image package
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: right-route-ocr:${{ github.sha }}
      IMAGE_TAR: right-route-ocr-${{ github.sha }}.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate syntax
        run: |
          python -m compileall -q api.py main.py

      - name: Run contract and pipeline unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run extraction regression gate
        run: |
          python scripts/run_regression_suite.py \
            --strict \
            --pipeline-mode deterministic \
            --dataset benchmarks/permit_samples.json \
            --min-complete-rate 0.90 \
            --max-start-end-only-rate 0.10 \
            --max-empty-segment-rate 0.10

      - name: Build Docker image
        run: docker build -t "${IMAGE_TAG}" .

      - name: Export Docker image artifact
        run: docker save "${IMAGE_TAG}" | gzip > "${IMAGE_TAR}"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: right-route-ocr-image
          path: ${{ env.IMAGE_TAR }}
          retention-days: 1

  deploy:
    name: CD deploy to EC2
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: right-route-ocr:${{ github.sha }}
      IMAGE_TAR: right-route-ocr-${{ github.sha }}.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: right-route-ocr-image
          path: .

      - name: Validate deploy secrets format
        env:
          PORT: ${{ secrets['PORT'] }}
          AWS_REGION: ${{ secrets['AWS_REGION'] }}
        run: |
          set -eu
          APP_PORT="${PORT:-8001}"

          if ! echo "${APP_PORT}" | grep -Eq '^[0-9]+$'; then
            echo "::error::PORT must be numeric only (example: 8001). Do not include PORT=."
            exit 1
          fi

          if [ "${APP_PORT}" -lt 1 ] || [ "${APP_PORT}" -gt 65535 ]; then
            echo "::error::PORT is out of range. Allowed range is 1..65535."
            exit 1
          fi

          if ! echo "${AWS_REGION}" | grep -Eq '^[a-z]{2}-[a-z]+-[0-9]+$'; then
            echo "::error::AWS_REGION must use format like eu-north-1. Do not include AWS_REGION=."
            exit 1
          fi

          echo "Deploy secret format checks passed."

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets['EC2_HOST'] }}
          username: ${{ secrets['EC2_USER'] }}
          key: ${{ secrets['EC2_SSH_KEY'] }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -eu
            APP_DIR=/opt/right-route-ocr
            DEPLOY_USER="$(id -un)"
            sudo mkdir -p "${APP_DIR}"
            sudo chown -R "${DEPLOY_USER}:${DEPLOY_USER}" "${APP_DIR}"

      - name: Sync project files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets['EC2_HOST'] }}
          username: ${{ secrets['EC2_USER'] }}
          key: ${{ secrets['EC2_SSH_KEY'] }}
          source: "docker-compose.ec2.yml,Dockerfile,requirements.txt,api.py,main.py"
          target: "/opt/right-route-ocr"
          overwrite: true
          rm: false
          strip_components: 0
          tar_dereference: true

      - name: Sync Docker image artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets['EC2_HOST'] }}
          username: ${{ secrets['EC2_USER'] }}
          key: ${{ secrets['EC2_SSH_KEY'] }}
          source: ${{ env.IMAGE_TAR }}
          target: "/opt/right-route-ocr"
          overwrite: true
          rm: false
          strip_components: 0
          tar_dereference: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          IMAGE_TAR: ${{ env.IMAGE_TAR }}
          PORT: ${{ secrets['PORT'] }}
          AWS_REGION: ${{ secrets['AWS_REGION'] }}
          AWS_ACCESS_KEY: ${{ secrets['AWS_ACCESS_KEY'] }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets['AWS_SECRET_ACCESS_KEY'] }}
          AWS_S3_BUCKET: ${{ secrets['AWS_S3_BUCKET'] }}
          OPENAI_API_KEY: ${{ secrets['OPENAI_API_KEY'] }}
        with:
          host: ${{ secrets['EC2_HOST'] }}
          username: ${{ secrets['EC2_USER'] }}
          key: ${{ secrets['EC2_SSH_KEY'] }}
          debug: true
          command_timeout: 45m
          script_stop: true
          envs: IMAGE_TAG,IMAGE_TAR,PORT,AWS_REGION,AWS_ACCESS_KEY,AWS_SECRET_ACCESS_KEY,AWS_S3_BUCKET,OPENAI_API_KEY
          script: |
            set -euo pipefail

            echo "[deploy] Starting remote deployment script"
            echo "[deploy] Checking Docker availability"

            IS_ROOT=0
            if [ "$(id -u)" -eq 0 ]; then
              IS_ROOT=1
            fi

            HAS_PASSWORDLESS_SUDO=0
            if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              HAS_PASSWORDLESS_SUDO=1
            fi

            run_privileged() {
              if [ "${IS_ROOT}" -eq 1 ]; then
                "$@"
              elif [ "${HAS_PASSWORDLESS_SUDO}" -eq 1 ]; then
                sudo -n "$@"
              else
                return 1
              fi
            }

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found. Installing Docker engine..."
              if ! run_privileged sh -c 'curl -fsSL https://get.docker.com | sh'; then
                echo "Cannot install Docker: root or passwordless sudo is required."
                exit 1
              fi
            fi

            echo "[debug] Testing docker access"
            docker info || true
            id
            groups

            echo "[deploy] Detecting Docker daemon access mode"
            if sudo -n docker info >/dev/null 2>&1; then
              USE_SUDO_DOCKER=1
            elif docker info >/dev/null 2>&1; then
              USE_SUDO_DOCKER=0
            else
              echo "Docker is not accessible even with sudo"
              sudo -n docker info || true
              exit 1
            fi

            docker_cmd() {
              if [ "${USE_SUDO_DOCKER}" -eq 1 ]; then
                sudo -n docker "$@"
              else
                docker "$@"
              fi
            }

            docker_compose() {
              if [ "${USE_SUDO_DOCKER}" -eq 1 ]; then
                sudo -n docker compose "$@"
              else
                docker compose "$@"
              fi
            }

            if ! docker_compose version >/tmp/docker_compose_version.log 2>&1; then
              echo "Docker Compose plugin not found. Installing..."
              if ! command -v apt-get >/dev/null 2>&1; then
                echo "apt-get is unavailable on this host. Install Docker Compose plugin manually."
                cat /tmp/docker_compose_version.log || true
                exit 1
              fi

              if ! run_privileged apt-get update; then
                echo "Failed to run apt-get update with current privileges."
                cat /tmp/docker_compose_version.log || true
                exit 1
              fi

              if ! run_privileged apt-get install -y docker-compose-plugin; then
                echo "Failed to install docker-compose-plugin."
                cat /tmp/docker_compose_version.log || true
                exit 1
              fi
            fi

            if ! docker_compose version >/dev/null 2>&1; then
              echo "Docker Compose is still unavailable after installation attempt."
              docker_cmd version || true
              exit 1
            fi

            echo "[deploy] Validating deploy parameters"

            APP_DIR=/opt/right-route-ocr
            COMPOSE_FILE=docker-compose.ec2.yml
            APP_PORT="${PORT:-8001}"

            if ! echo "${APP_PORT}" | grep -Eq '^[0-9]+$'; then
              echo "Invalid PORT secret value: ${APP_PORT}"
              echo "Use a numeric port value between 1 and 65535."
              exit 1
            fi

            if [ "${APP_PORT}" -lt 1 ] || [ "${APP_PORT}" -gt 65535 ]; then
              echo "PORT out of range: ${APP_PORT}"
              exit 1
            fi

            for required in AWS_REGION AWS_ACCESS_KEY AWS_SECRET_ACCESS_KEY OPENAI_API_KEY IMAGE_TAG IMAGE_TAR; do
              value=""
              if [ "${required}" = "AWS_REGION" ]; then
                value="${AWS_REGION:-}"
              elif [ "${required}" = "AWS_ACCESS_KEY" ]; then
                value="${AWS_ACCESS_KEY:-}"
              elif [ "${required}" = "AWS_SECRET_ACCESS_KEY" ]; then
                value="${AWS_SECRET_ACCESS_KEY:-}"
              elif [ "${required}" = "OPENAI_API_KEY" ]; then
                value="${OPENAI_API_KEY:-}"
              elif [ "${required}" = "IMAGE_TAG" ]; then
                value="${IMAGE_TAG:-}"
              elif [ "${required}" = "IMAGE_TAR" ]; then
                value="${IMAGE_TAR:-}"
              fi

              if [ -z "${value}" ]; then
                echo "Missing required GitHub Secret: ${required}"
                exit 1
              fi
            done

            if ! echo "${AWS_REGION}" | grep -Eq '^[a-z]{2}-[a-z]+-[0-9]+$'; then
              echo "Invalid AWS_REGION secret value: ${AWS_REGION}"
              echo "Use region code format such as eu-north-1 or us-east-1."
              exit 1
            fi

            echo "[deploy] Loading image artifact"
            cd "${APP_DIR}"

            docker_cmd image prune -af || true

            if [ ! -f "${IMAGE_TAR}" ]; then
              echo "Docker image artifact not found: ${IMAGE_TAR}"
              ls -la
              exit 1
            fi

            gzip -dc "${IMAGE_TAR}" | docker_cmd load
            rm -f "${IMAGE_TAR}"

            echo "[deploy] Resolving image and host architecture"
            normalize_arch() {
              if [ "$1" = "x86_64" ] || [ "$1" = "amd64" ]; then
                echo "amd64"
              elif [ "$1" = "aarch64" ] || [ "$1" = "arm64" ]; then
                echo "arm64"
              else
                echo "$1"
              fi
            }

            HOST_ARCH="$(normalize_arch "$(uname -m)")"
            IMAGE_ARCH="$(docker_cmd image inspect "${IMAGE_TAG}" --format '{{.Architecture}}' 2>/dev/null || echo unknown)"
            IMAGE_ARCH="$(normalize_arch "${IMAGE_ARCH}")"

            if [ "${IMAGE_ARCH}" != "unknown" ] && [ "${IMAGE_ARCH}" != "${HOST_ARCH}" ]; then
              echo "Image architecture ${IMAGE_ARCH} does not match host ${HOST_ARCH}."
              echo "Building a native image on EC2 as fallback..."
              docker_cmd build -t "${IMAGE_TAG}" .
            fi

            AWS_S3_BUCKET="${AWS_S3_BUCKET:-}"

            echo "[deploy] Writing runtime environment file"
            : > .env
            append_env() {
              printf '%s=%s\n' "$1" "$2" >> .env
            }

            append_env PORT "${APP_PORT}"
            append_env IMAGE_NAME "${IMAGE_TAG}"
            append_env AWS_REGION "${AWS_REGION}"
            append_env AWS_ACCESS_KEY "${AWS_ACCESS_KEY}"
            append_env AWS_SECRET_ACCESS_KEY "${AWS_SECRET_ACCESS_KEY}"
            append_env AWS_S3_BUCKET "${AWS_S3_BUCKET}"
            append_env OPENAI_API_KEY "${OPENAI_API_KEY}"

            echo "[deploy] Restarting compose service"
            docker_compose -f "${COMPOSE_FILE}" down --remove-orphans || true

            if ! docker_compose -f "${COMPOSE_FILE}" up -d --force-recreate; then
              echo "docker compose up returned a non-zero status. Continuing with diagnostics..."
            fi

            HEALTH_URL="http://127.0.0.1:${APP_PORT}/"

            http_ready() {
              if command -v curl >/dev/null 2>&1; then
                curl --fail --silent --max-time 5 "${HEALTH_URL}" >/dev/null 2>&1
                return $?
              fi
              if command -v wget >/dev/null 2>&1; then
                wget -q -O /dev/null "${HEALTH_URL}" >/dev/null 2>&1
                return $?
              fi
              return 2
            }

            ATTEMPTS=40
            COUNT=1
            until [ "${COUNT}" -gt "${ATTEMPTS}" ]; do
              CONTAINER_STATE="$(docker_cmd inspect --format '{{.State.Status}}' right-route-ocr-api 2>/dev/null || true)"
              CONTAINER_HEALTH="$(docker_cmd inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' right-route-ocr-api 2>/dev/null || true)"

              if [ "${CONTAINER_STATE}" = "exited" ] || [ "${CONTAINER_STATE}" = "dead" ]; then
                echo "Container stopped unexpectedly during deployment."
                docker_compose -f "${COMPOSE_FILE}" ps || true
                docker_compose -f "${COMPOSE_FILE}" logs --tail=200 || true
                exit 1
              fi

              if http_ready; then
                echo "Deployment successful. HTTP health check passed at ${HEALTH_URL}."
                exit 0
              fi

              if [ "${CONTAINER_HEALTH}" = "healthy" ]; then
                echo "Deployment successful. Container health is healthy."
                exit 0
              fi

              if [ "${COUNT}" -eq 1 ] || [ $((COUNT % 5)) -eq 0 ]; then
                echo "Waiting for readiness (${COUNT}/${ATTEMPTS}) state=${CONTAINER_STATE:-unknown} health=${CONTAINER_HEALTH:-unknown}"
              fi

              sleep 3
              COUNT=$((COUNT + 1))
            done

            echo "Health check failed after deployment."
            docker_compose -f "${COMPOSE_FILE}" ps || true
            docker_compose -f "${COMPOSE_FILE}" logs --tail=200 || true
            exit 1
